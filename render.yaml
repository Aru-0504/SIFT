services:
  # Full-Stack Web Service (FastAPI + React bundle)
  - type: web
    name: sift-app
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sift-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: QUOTE_CACHE_TTL_SECONDS
        value: "45"

databases:
  - name: sift-postgres
    plan: free
    region: oregon
    databaseName: sift_db
    user: sift_user
